server:
  port: 8088

spring:
  application:
    name: leetcode-crawler
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:student_oj}?useSSL=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

leetcode:
  crawler:
    enabled: ${LEETCODE_CRAWLER_ENABLED:true}
    graphql-url: ${LEETCODE_GRAPHQL_URL:https://leetcode.cn/graphql}
    base-url: ${LEETCODE_BASE_URL:https://leetcode.cn}
    category-slug: database
    page-size: ${LEETCODE_PAGE_SIZE:50}
    request-min-delay-ms: ${LEETCODE_MIN_DELAY_MS:1000}
    request-max-delay-ms: ${LEETCODE_MAX_DELAY_MS:2000}
    user-agent: ${LEETCODE_USER_AGENT:Mozilla/5.0 StudentOJ SQL Crawler}
    cookie: ${LEETCODE_COOKIE:}
    scheduled-cron: ${LEETCODE_SYNC_CRON:0 0 2 * * ?}
    sync-on-startup: ${LEETCODE_SYNC_ON_STARTUP:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
