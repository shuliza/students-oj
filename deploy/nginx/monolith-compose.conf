server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA：history 路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 登录：公开端点，单体 AuthInterceptor 已放行，无需注入身份头，直接透传。
    # 上游写死容器服务名 app:8080，nginx 启动时经 Docker 内嵌 DNS 解析（depends_on 保证 app 先就绪）。
    location = /api/auth/login {
        proxy_set_header X-Auth-User-Id "";
        proxy_set_header X-Auth-Username "";
        proxy_set_header X-Auth-User-Role "";
        proxy_set_header X-Internal-Auth "";
        proxy_pass http://app:8080/api/auth/login;
    }

    # 内部子请求：用 Bearer token 调单体的 introspect 校验身份，回传 X-Auth-* 头
    location = /_auth {
        internal;
        proxy_pass http://app:8080/api/auth/introspect;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # 其余所有 /api/** 端点：先 auth_request 校验，再注入身份头与内部密钥，统一转发给单体。
    location /api/ {
        auth_request /_auth;
        auth_request_set $auth_user_id $upstream_http_x_auth_user_id;
        auth_request_set $auth_username $upstream_http_x_auth_username;
        auth_request_set $auth_user_role $upstream_http_x_auth_user_role;
        proxy_set_header X-Auth-User-Id $auth_user_id;
        proxy_set_header X-Auth-Username $auth_username;
        proxy_set_header X-Auth-User-Role $auth_user_role;
        proxy_set_header X-Internal-Auth "student-oj-internal-v1";
        proxy_pass http://app:8080/api/;
    }
}
