server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /api/auth/login {
    proxy_set_header X-User-Id "";
    proxy_set_header X-Auth-User-Id "";
    proxy_set_header X-Auth-Username "";
    proxy_set_header X-Auth-User-Role "";
    proxy_set_header X-Internal-Auth "";
    proxy_pass http://auth-service:8081/api/auth/login;
  }

  location = /_auth {
    internal;
    proxy_pass http://auth-service:8081/api/auth/introspect;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-User-Id "";
  }

  location /api/auth/ {
    auth_request /_auth;
    auth_request_set $auth_user_id $upstream_http_x_auth_user_id;
    auth_request_set $auth_username $upstream_http_x_auth_username;
    auth_request_set $auth_user_role $upstream_http_x_auth_user_role;
    proxy_set_header X-User-Id "";
    proxy_set_header X-Auth-User-Id $auth_user_id;
    proxy_set_header X-Auth-Username $auth_username;
    proxy_set_header X-Auth-User-Role $auth_user_role;
    proxy_set_header X-Internal-Auth "student-oj-internal-v1";
    proxy_pass http://auth-service:8081/api/auth/;
  }

  location /api/problem/ {
    auth_request /_auth;
    auth_request_set $auth_user_id $upstream_http_x_auth_user_id;
