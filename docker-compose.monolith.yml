# ============================================================
# 单体架构部署编排（区别于 docker-compose.yml 的 8 微服务版）
# 一条命令启动全栈：MySQL + Redis + 单体应用(app) + 前端网关(web)
#
#   docker compose -f docker-compose.monolith.yml up -d --build
#
# 浏览器访问 http://localhost   （web 容器 80 端口）
# ============================================================
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_oj
    ports:
      - "3307:3306"
    volumes:
      - monolith-mysql-data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--max-connections=300"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 单体后端：原 8 个微服务合并为进程内直调，仅依赖 MySQL + Redis
  app:
    image: student-oj-app:${STUDENTOJ_IMAGE_TAG:-0.1.0}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: app
    environment:
      SERVER_PORT: "8080"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: student_oj
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SANDBOX_MYSQL_DATABASE: student_oj_sandbox
      SANDBOX_MYSQL_USERNAME: sandbox
      SANDBOX_MYSQL_PASSWORD: sandbox123
      STUDENTOJ_AUTH_INTERNAL_SECRET: student-oj-internal-v1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "18080:8080"   # 直连后端调试用，可按需移除
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # 前端 + nginx 网关：容器内构建 Vue，做 auth_request 鉴权并转发给 app
  web:
    image: student-oj-monolith-web:${STUDENTOJ_IMAGE_TAG:-0.1.0}
    build:
      context: .
      dockerfile: Dockerfile.monolith-web
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  monolith-mysql-data:
